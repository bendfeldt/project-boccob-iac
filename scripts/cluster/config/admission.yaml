# kube-apiserver admission configuration (k3s CIS hardening guide).
apiVersion: apiserver.config.k8s.io/v1
kind: AdmissionConfiguration
plugins:
  - name: PodSecurity
    configuration:
      apiVersion: pod-security.admission.config.k8s.io/v1
      kind: PodSecurityConfiguration
      # Cluster-wide floor for namespaces WITHOUT explicit PSS labels.
      # Platform namespaces set their own level (normally `restricted`) through
      # modules/namespace-baseline.
      defaults:
        enforce: "baseline"
        enforce-version: "latest"
        audit: "restricted"
        audit-version: "latest"
        warn: "restricted"
        warn-version: "latest"
      exemptions:
        usernames: []
        runtimeClasses: []
        # k3s system components (svclb, local-path helper pods) need host access
        namespaces: ["kube-system"]
  - name: EventRateLimit
    configuration:
      apiVersion: eventratelimit.admission.k8s.io/v1alpha1
      kind: Configuration
      limits:
        - type: Server
          qps: 5000
          burst: 20000
