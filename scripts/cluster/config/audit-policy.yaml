# Kubernetes API audit policy (ISO 27001 A.8.15 / NIS2 logging).
# Order matters: first match wins.
apiVersion: audit.k8s.io/v1
kind: Policy
omitStages:
  - RequestReceived
rules:
  # noisy, low-value read traffic from the control plane itself
  - level: None
    users: ["system:kube-proxy", "system:apiserver"]
    verbs: ["watch", "get", "list"]
  - level: None
    userGroups: ["system:nodes"]
    verbs: ["get", "list", "watch"]
    resources:
      - group: ""
        resources: ["nodes", "nodes/status", "pods", "pods/status", "endpoints", "services", "configmaps"]
  - level: None
    nonResourceURLs: ["/healthz*", "/livez*", "/readyz*", "/version", "/metrics", "/openapi/*", "/api*", "/apis*"]
    verbs: ["get"]
  - level: None
    resources:
      - group: ""
        resources: ["events"]
      - group: "events.k8s.io"
        resources: ["events"]
  - level: None
    verbs: ["get", "list", "watch", "update", "patch"]
    resources:
      - group: "coordination.k8s.io"
        resources: ["leases"]

  # never log secret payloads: metadata only for secret-bearing resources
  - level: Metadata
    resources:
      - group: ""
        resources: ["secrets", "configmaps", "serviceaccounts/token"]
      - group: "authentication.k8s.io"
        resources: ["tokenreviews", "tokenrequests"]
      - group: "external-secrets.io"
      - group: "generators.external-secrets.io"

  # interactive access to workloads: who exec'd / port-forwarded where
  - level: Request
    resources:
      - group: ""
        resources: ["pods/exec", "pods/attach", "pods/portforward", "pods/ephemeralcontainers"]

  # every change to RBAC, admission, network policy and policy objects in full
  - level: RequestResponse
    verbs: ["create", "update", "patch", "delete", "deletecollection"]
    resources:
      - group: "rbac.authorization.k8s.io"
      - group: "admissionregistration.k8s.io"
      - group: "networking.k8s.io"
        resources: ["networkpolicies"]
      - group: "kyverno.io"
      - group: "policies.kyverno.io"

  # all other mutations: request body, no response
  - level: Request
    verbs: ["create", "update", "patch", "delete", "deletecollection"]

  # remaining reads: metadata
  - level: Metadata
