# versions.yaml — HUMAN-EDITED desired versions (source of intent).
#
# `make lock` resolves this file into versions.lock.yaml (digests + checksums).
# versions.lock.yaml is the single source of truth consumed by:
#   - scripts/airgap/*      (what to mirror into Zot / put into the bundle)
#   - modules/versions      (what OpenTofu deploys; image refs are pinned by digest)
#   - scripts/cluster/*     (k3s binary / images, Zot bootstrap image)
#
# Rules:
#   - every image and chart used anywhere in this repo MUST be listed here;
#   - keys are stable logical names ([a-z0-9-]) referenced from HCL as
#     module.versions.images["<key>"] / module.versions.charts["<key>"];
#   - `groups` tag an entry with the stack(s) that need it, so a partial mirror
#     is possible (make airgap-mirror GROUPS=foundation).
#
# Zot layout produced by the mirror:
#   images: <registry>/<source registry>/<repo>:<tag>@<digest>   e.g. registry/quay.io/openbao/openbao:2.7.2
#   charts: oci://<registry>/charts/<name>:<version>
#   solution artefacts (pushed by the solution repo): <registry>/boccob/<name>

platform: linux/amd64

k3s:
  version: v1.35.10+k3s1

images:
  # --- cluster bootstrap -----------------------------------------------------
  k3s:
    source: docker.io/rancher/k3s
    tag: v1.35.10-k3s1
    groups: [cluster]
  zot:
    source: ghcr.io/project-zot/zot
    tag: v2.1.23
    groups: [cluster]
  # k3s system images (k3s-images.txt of the pinned release); pulled by the
  # node itself through the registries.yaml mirror, so they only need mirroring.
  k3s-klipper-helm:
    source: docker.io/rancher/klipper-helm
    tag: v0.13.3-build20261021
    groups: [cluster]
  k3s-klipper-lb:
    source: docker.io/rancher/klipper-lb
    tag: v0.4.17
    groups: [cluster]
  k3s-local-path-provisioner:
    source: docker.io/rancher/local-path-provisioner
    tag: v0.0.37
    groups: [cluster]
  k3s-coredns:
    source: docker.io/rancher/mirrored-coredns-coredns
    tag: 1.14.7
    groups: [cluster]
  k3s-busybox:
    source: docker.io/rancher/mirrored-library-busybox
    tag: 1.37.0
    groups: [cluster]
  k3s-traefik:
    source: docker.io/rancher/mirrored-library-traefik
    tag: 3.7.15
    groups: [cluster]
  k3s-metrics-server:
    source: docker.io/rancher/mirrored-metrics-server
    tag: v0.9.0
    groups: [cluster]
  k3s-pause:
    source: docker.io/rancher/mirrored-pause
    tag: 3.10.2
    groups: [cluster]

  # --- foundation --------------------------------------------------------------
  cert-manager-controller:
    source: quay.io/jetstack/cert-manager-controller
    tag: v1.21.3
    groups: [foundation]
  cert-manager-webhook:
    source: quay.io/jetstack/cert-manager-webhook
    tag: v1.21.3
    groups: [foundation]
  cert-manager-cainjector:
    source: quay.io/jetstack/cert-manager-cainjector
    tag: v1.21.3
    groups: [foundation]
  cert-manager-acmesolver:
    source: quay.io/jetstack/cert-manager-acmesolver
    tag: v1.21.3
    groups: [foundation]
  openbao:
    source: quay.io/openbao/openbao
    tag: 2.7.2
    groups: [foundation]
  external-secrets:
    source: ghcr.io/external-secrets/external-secrets
    tag: v2.15.0
    groups: [foundation]
  cloudnative-pg:
    source: ghcr.io/cloudnative-pg/cloudnative-pg
    tag: 1.30.1
    groups: [foundation]
  postgresql:
    # "system" flavour = includes barman-cloud for in-tree object-store backups
    source: ghcr.io/cloudnative-pg/postgresql
    tag: 17.12-system-trixie
    groups: [foundation]
  rustfs:
    source: docker.io/rustfs/rustfs
    tag: 1.0.6
    groups: [foundation]
  rustfs-rc:
    # RustFS S3/admin CLI, used by the bucket provisioning Job
    source: docker.io/rustfs/rc
    tag: v0.1.37
    groups: [foundation]
  busybox:
    source: docker.io/library/busybox
    tag: 1.38.0
    groups: [foundation]
  keycloak:
    source: quay.io/keycloak/keycloak
    tag: 26.8.2
    groups: [foundation]

  # --- data plane (stacks 20-catalog, 21-query, 22-orchestration) ----------------
  polaris:
    source: docker.io/apache/polaris
    tag: 1.9.0
    groups: [data-plane]
  polaris-admin-tool:
    # realm bootstrap of the relational metastore (Job)
    source: docker.io/apache/polaris-admin-tool
    tag: 1.9.0
    groups: [data-plane]
  trino:
    source: docker.io/trinodb/trino
    tag: "484"
    groups: [data-plane]
  opa:
    source: docker.io/openpolicyagent/opa
    tag: 1.22.4-static
    groups: [data-plane]
  jmx-exporter:
    # default exporter image of the Trino chart (frozen "legacy" repository, see docs/data-plane.md)
    source: docker.io/bitnamilegacy/jmx-exporter
    tag: 1.4.0
    groups: [data-plane]
  oauth2-proxy:
    source: quay.io/oauth2-proxy/oauth2-proxy
    tag: v7.15.6
    groups: [data-plane]
  python:
    # provisioning Jobs and small sidecars (Polaris provisioning, Trino group sync / audit sink)
    source: docker.io/library/python
    tag: 3.13-slim-bookworm
    groups: [data-plane]

  # --- policy / supply chain (stack 31-policy) ----------------------------------
  kyverno:
    source: ghcr.io/kyverno/kyverno
    tag: v1.19.2
    groups: [policy]
  kyverno-pre:
    source: ghcr.io/kyverno/kyvernopre
    tag: v1.19.2
    groups: [policy]
  kyverno-background-controller:
    source: ghcr.io/kyverno/background-controller
    tag: v1.19.2
    groups: [policy]
  kyverno-reports-controller:
    source: ghcr.io/kyverno/reports-controller
    tag: v1.19.2
    groups: [policy]

  # --- observability + audit (stack 30-observability) ---------------------------
  prometheus:
    source: quay.io/prometheus/prometheus
    tag: v3.16.0
    groups: [observability]
  prometheus-config-reloader:
    source: quay.io/prometheus-operator/prometheus-config-reloader
    tag: v0.95.2
    groups: [observability]
  alertmanager:
    source: quay.io/prometheus/alertmanager
    tag: v0.35.0
    groups: [observability]
  # kube-state-metrics (registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0)
  # is not listed: its blobs are served from us-east5-docker.pkg.dev, which the build
  # sandbox cannot reach. Add it here, `make lock`, and set
  # kube_state_metrics_enabled = true (stack 30-observability) where it is reachable.
  loki:
    source: docker.io/grafana/loki
    tag: 3.6.18
    groups: [observability]
  otel-collector:
    # "k8s" distribution: file_log, k8s_attributes, routing, otlp_http (checked with `components`)
    source: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s
    tag: 0.163.2
    groups: [observability]
  grafana:
    # separate group: ~480 MB, optional (grafana_enabled)
    source: docker.io/grafana/grafana
    tag: 13.3.1
    groups: [observability-ui]

charts:
  cert-manager:
    repo: https://charts.jetstack.io
    name: cert-manager
    version: v1.21.3
    groups: [foundation]
  openbao:
    repo: https://openbao.github.io/openbao-helm
    name: openbao
    version: 0.30.7
    groups: [foundation]
  external-secrets:
    repo: oci://ghcr.io/external-secrets/charts
    name: external-secrets
    version: 2.15.0
    groups: [foundation]
  cloudnative-pg:
    repo: oci://ghcr.io/cloudnative-pg/charts
    name: cloudnative-pg
    version: 0.29.1
    groups: [foundation]
  rustfs:
    repo: https://charts.rustfs.com
    name: rustfs
    version: 1.0.6
    groups: [foundation]
  polaris:
    repo: https://downloads.apache.org/polaris/helm-chart
    name: polaris
    version: 1.9.0
    groups: [data-plane]
  trino:
    repo: https://trinodb.github.io/charts
    name: trino
    version: 1.45.0
    groups: [data-plane]
  dagster:
    repo: https://dagster-io.github.io/helm
    name: dagster
    version: 1.13.30
    groups: [data-plane]
  dagster-user-deployments:
    # code locations as a separate release (no busybox nslookup init containers in the system pods)
    repo: https://dagster-io.github.io/helm
    name: dagster-user-deployments
    version: 1.13.30
    groups: [data-plane]
  kyverno:
    repo: https://kyverno.github.io/kyverno
    name: kyverno
    version: 3.9.2
    groups: [policy]
  prometheus:
    repo: https://prometheus-community.github.io/helm-charts
    name: prometheus
    version: 29.47.2
    groups: [observability]
  loki:
    repo: https://grafana.github.io/helm-charts
    name: loki
    version: 7.6.0
    groups: [observability]
  opentelemetry-collector:
    repo: oci://ghcr.io/open-telemetry/opentelemetry-helm-charts
    name: opentelemetry-collector
    version: 0.178.3
    groups: [observability]
  grafana:
    repo: oci://ghcr.io/grafana-community/helm-charts
    name: grafana
    version: 14.4.2
    groups: [observability-ui]

# Files downloaded verbatim (air-gap bundle + operator workstation tools).
# `sha256` is filled in by `make lock` on first resolution and verified on
# every later download.
binaries:
  k3s:
    url: https://github.com/k3s-io/k3s/releases/download/v1.35.10%2Bk3s1/k3s
    file: k3s
    groups: [cluster]
  k3s-airgap-images:
    url: https://github.com/k3s-io/k3s/releases/download/v1.35.10%2Bk3s1/k3s-airgap-images-amd64.tar.zst
    file: k3s-airgap-images-amd64.tar.zst
    groups: [cluster]
  k3s-install:
    url: https://raw.githubusercontent.com/k3s-io/k3s/v1.35.10%2Bk3s1/install.sh
    file: k3s-install.sh
    groups: [cluster]
  cosign:
    url: https://github.com/sigstore/cosign/releases/download/v3.1.4/cosign-linux-amd64
    file: cosign
    groups: [tools]
  trivy:
    url: https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz
    file: trivy.tar.gz
    extract: trivy
    groups: [tools]
  syft:
    url: https://github.com/anchore/syft/releases/download/v1.57.1/syft_1.57.1_linux_amd64.tar.gz
    file: syft.tar.gz
    extract: syft
    groups: [tools]
